<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BloomWake — Aeria: Last Bloom</title>
  <meta name="description" content="A Frutiger Aero survivor-arena web game where Dewling defends against the Frutevil stain." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* Phase 6: Frutiger Aero. Page background matches the canvas gradient's
       darkest stop so any overscroll or letterbox blends in. */
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03080f;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e8fbff;
    }

    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #071a24, #03080f);
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #ui-layer * {
      pointer-events: auto;
    }

    /* Boot overlay — shown until every texture has resolved. */
    #boot-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: linear-gradient(180deg, #071a24, #03080f);
      z-index: 10;
    }

    #boot-mark {
      font-size: clamp(28px, 7vw, 54px);
      font-weight: 800;
      letter-spacing: 0.22em;
      background: linear-gradient(180deg, #f2fdff, #6fd6f0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 26px rgba(127, 230, 255, 0.5));
    }

    #boot-status {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6f97a8;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer"></div>
    <!-- Removed by boot() once the texture manifest resolves. -->
    <div id="boot-screen">
      <div id="boot-mark">BLOOMWAKE</div>
      <div id="boot-status">Loading assets…</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
